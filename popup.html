<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }

    body {
      width: 300px;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #fff;
    }

    header {
      background: #ee4d2d;
      color: #fff;
      padding: 14px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
    }

    main {
      padding: 14px;
    }

    p {
      margin: 0 0 12px;
      color: #596273;
      font-size: 13px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 6px;
      background: #ee4d2d;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Shopee Reviews Exporter</h1>
  </header>

  <main>
    <p>Abra o painel para coletar varios produtos com limite de paginas simultaneas.</p>
    <button id="openManager">Abrir painel</button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
